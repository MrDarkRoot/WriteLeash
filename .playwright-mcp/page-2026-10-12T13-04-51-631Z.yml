        - generic [ref=f15e43]:
          - heading "WriteLeash Bulk Prices" [level=1] [ref=f15e44]
          - paragraph [ref=f15e46]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
          - paragraph [ref=f15e47]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
          - paragraph [ref=f15e48]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
          - heading "New price change" [level=2] [ref=f15e49]
          - heading "Saved price presets" [level=2] [ref=f15e50]
          - paragraph [ref=f15e51]: Presets save configuration only. Load, edit, then prepare and approve a fresh Preview. Current products, permissions and limits are checked again. Up to 20 presets per store; creators and administrators can manage them.
          - paragraph [ref=f15e52]: Presets save the editable selection and price range, not individual Preview exclusions. To exclude products, create a fresh Preview and confirm exclusions before approving it.
          - generic [ref=f15e53]:
            - group "1. Select products" [ref=f15e54]:
              - paragraph [ref=f15e56]: Choose specific products or one category. Categories include direct members only by default; subcategories are not included unless you enable Include subcategories. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
