                  - checkbox "Only change products in a price range" [ref=f15e84] [cursor=pointer]
                  - generic [ref=f15e85]: Only change products in a price range
                - paragraph [ref=f15e86]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
