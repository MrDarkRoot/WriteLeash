            - group "2. Choose the price change" [ref=f15e96]:
              - paragraph [ref=f15e98]:
                - generic [ref=f15e99]: Price to change
                - combobox "Price to change" [ref=f15e100] [cursor=pointer]:
                  - option "Regular price" [selected]
                  - option "Sale price"
              - paragraph [ref=f15e101]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
              - paragraph [ref=f15e102]:
                - generic [ref=f15e103]: Operation
                - combobox "Operation" [ref=f15e104] [cursor=pointer]:
                  - option "Set an exact price" [selected]
                  - option "Increase by fixed amount"
                  - option "Decrease by fixed amount"
                  - option "Increase by percent"
                  - option "Decrease by percent"
                  - option "Clear Sale Price"
                  - option "Sale discount from Regular Price (%)"
              - paragraph [ref=f15e105]:
                - generic [ref=f15e106]: Price Ending (optional)
                - combobox "Price Ending (optional)" [ref=f15e107] [cursor=pointer]:
                  - option "Unchanged / Default" [selected]
                  - option "End in .99"
                  - option "End in .95"
                  - option "End in .90"
                  - option "Whole-number price"
              - paragraph [ref=f15e108]: Nearest nonnegative matching price; exact ties go upward. Below the first ending, use 0.99, 0.95 or 0.90; whole prices may become zero. Default keeps existing calculations. .99/.95 need two decimal places; .90 needs one. Clear Sale ignores endings and stays blank. Preview checks the final rounded price against all safety limits.
              - paragraph [ref=f15e109]:
                - generic [ref=f15e110]: New price
                - textbox "New price" [ref=f15e111]
              - paragraph [ref=f15e112]: Enter a positive number or zero. Use a dot for decimals; leave out currency symbols and the % sign.
              - paragraph [ref=f15e113]: Choose Sale price for Clear or Sale discount. Clear makes Sale Price blank and preserves sale schedules; safety caps check the return to Regular Price. Sale discount requires an explicit 0–100 percentage (up to six decimal places), calculated from each product’s own reviewed Regular Price. A changed Regular Price conflicts at Apply; the approved target is never recalculated. Zero or a sale at Regular Price still must pass eligibility and safety checks.
