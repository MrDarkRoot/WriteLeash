                - paragraph [ref=f3e74]: When enabled, products in all nested subcategories are included once. Variable parents expand to their variations.
              - paragraph [ref=f3e75]:
                - button "Check selection count" [ref=f3e76] [cursor=pointer]
              - status [ref=f3e77]: "At last check: 5 deduplicated price targets after variation expansion. 0 unreadable; 0 missing. Preview explains skipped or unsupported products."
              - paragraph [ref=f3e78]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f3e79]:
                - paragraph [ref=f3e80]:
                  - checkbox "Only change products in a price range" [ref=f3e81] [cursor=pointer]
                  - generic [ref=f3e82]: Only change products in a price range
                - paragraph [ref=f3e83]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
