            - group "2. Choose the price change" [ref=f3e93]:
              - paragraph [ref=f3e95]:
                - generic [ref=f3e96]: Price to change
                - combobox "Price to change" [ref=f3e97] [cursor=pointer]:
                  - option "Regular price" [selected]
                  - option "Sale price"
              - paragraph [ref=f3e98]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
              - paragraph [ref=f3e99]:
                - generic [ref=f3e100]: Operation
                - combobox "Operation" [ref=f3e101] [cursor=pointer]:
                  - option "Set an exact price"
                  - option "Increase by fixed amount" [selected]
                  - option "Decrease by fixed amount"
                  - option "Increase by percent"
                  - option "Decrease by percent"
                  - option "Clear Sale Price"
                  - option "Sale discount from Regular Price (%)"
              - paragraph [ref=f3e102]:
                - generic [ref=f3e103]: Price Ending (optional)
                - combobox "Price Ending (optional)" [ref=f3e104] [cursor=pointer]:
                  - option "Unchanged / Default" [selected]
                  - option "End in .99"
                  - option "End in .95"
                  - option "End in .90"
                  - option "Whole-number price"
              - paragraph [ref=f3e105]: Nearest nonnegative matching price; exact ties go upward. Below the first ending, use 0.99, 0.95 or 0.90; whole prices may become zero. Default keeps existing calculations. .99/.95 need two decimal places; .90 needs one. Clear Sale ignores endings and stays blank. Preview checks the final rounded price against all safety limits.
              - paragraph [ref=f3e106]:
                - generic [ref=f3e107]: Amount to increase by
                - textbox "Amount to increase by" [ref=f3e108]: "2"
              - paragraph [ref=f3e109]: Enter a positive number or zero. Use a dot for decimals; leave out currency symbols and the % sign.
              - paragraph [ref=f3e110]: Choose Sale price for Clear or Sale discount. Clear makes Sale Price blank and preserves sale schedules; safety caps check the return to Regular Price. Sale discount requires an explicit 0–100 percentage (up to six decimal places), calculated from each product’s own reviewed Regular Price. A changed Regular Price conflicts at Apply; the approved target is never recalculated. Zero or a sale at Regular Price still must pass eligibility and safety checks.
