      - generic [ref=f21e250]:
        - heading "WriteLeash Bulk Prices" [level=1] [ref=f21e251]
        - paragraph [ref=f21e252]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
        - paragraph [ref=f21e253]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
        - paragraph [ref=f21e254]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
        - heading "New price change" [level=2] [ref=f21e255]
        - generic [ref=f21e256]:
          - group "1. Select products" [ref=f21e257]:
            - paragraph [ref=f21e259]: Choose specific products or one category. Categories include direct members only; subcategories are not included. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
            - paragraph [ref=f21e260]:
              - generic [ref=f21e261]: Selection method
              - combobox "Selection method" [ref=f21e262] [cursor=pointer]:
                - option "Choose products by name or SKU"
                - option "Product category"
                - option "One exact SKU" [selected]
                - 'option "Advanced: manual product IDs"'
            - status
            - group [ref=f21e394]:
              - generic "Exact SKU or manual product IDs" [ref=f21e395] [cursor=pointer]
              - paragraph [ref=f21e396]: Enter one complete SKU or comma-separated product IDs for the selection method chosen above.
              - paragraph [ref=f21e397]:
                - generic [ref=f21e398]: One exact SKU
                - textbox "One exact SKU" [ref=f21e399]
          - group "2. Choose the price change" [ref=f21e281]:
            - paragraph [ref=f21e283]:
              - generic [ref=f21e284]: Price to change
              - combobox "Price to change" [ref=f21e285] [cursor=pointer]:
                - option "Regular price" [selected]
                - option "Sale price"
            - paragraph [ref=f21e286]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
            - paragraph [ref=f21e287]:
              - generic [ref=f21e288]: Operation
              - combobox "Operation" [ref=f21e289] [cursor=pointer]:
