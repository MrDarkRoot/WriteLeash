                - combobox "Price Ending (optional)" [ref=f1e116] [cursor=pointer]:
                  - option "Unchanged / Default" [selected]
                  - option "End in .99"
                  - option "End in .95"
                  - option "End in .90"
                  - option "Whole-number price"
              - paragraph [ref=f1e117]: Nearest nonnegative matching price; exact ties go upward. Below the first ending, use 0.99, 0.95 or 0.90; whole prices may become zero. Default keeps existing calculations. .99/.95 need two decimal places; .90 needs one. Clear Sale ignores endings and stays blank. Preview checks the final rounded price against all safety limits.
              - paragraph [ref=f1e118]:
                - generic [ref=f1e119]: New price
                - textbox "New price" [ref=f1e120]
              - paragraph [ref=f1e121]: Enter a positive number or zero. Use a dot for decimals; leave out currency symbols and the % sign.
              - paragraph [ref=f1e122]: Choose Sale price for Clear or Sale discount. Clear makes Sale Price blank and preserves sale schedules; safety caps check the return to Regular Price. Sale discount requires an explicit 0–100 percentage (up to six decimal places), calculated from each product’s own reviewed Regular Price. A changed Regular Price conflicts at Apply; the approved target is never recalculated. Zero or a sale at Regular Price still must pass eligibility and safety checks.
