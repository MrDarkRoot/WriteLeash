          - heading "WriteLeash Bulk Prices" [level=1] [ref=f16e44]
          - alert [ref=f16e46]:
            - paragraph [ref=f16e47]: Preset saved. No prices changed; prepare a fresh Preview before applying.
          - paragraph [ref=f16e48]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
          - paragraph [ref=f16e49]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
          - paragraph [ref=f16e50]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
          - heading "New price change" [level=2] [ref=f16e51]
          - heading "Saved price presets" [level=2] [ref=f16e52]
          - paragraph [ref=f16e53]: Presets save configuration only. Load, edit, then prepare and approve a fresh Preview. Current products, permissions and limits are checked again. Up to 20 presets per store; creators and administrators can manage them.
          - paragraph [ref=f16e54]: Presets save the editable selection and price range, not individual Preview exclusions. To exclude products, create a fresh Preview and confirm exclusions before approving it.
