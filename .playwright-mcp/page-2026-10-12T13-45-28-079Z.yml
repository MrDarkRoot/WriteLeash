          - alert [ref=f21e46]:
            - paragraph [ref=f21e47]: Preset loaded into the editable form. Check the selection, prepare a fresh Preview and approve independently. No prices changed.
          - paragraph [ref=f21e48]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
          - paragraph [ref=f21e49]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
          - paragraph [ref=f21e50]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
