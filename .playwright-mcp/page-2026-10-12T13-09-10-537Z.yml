                - paragraph [ref=f11e77]: When enabled, products in all nested subcategories are included once. Variable parents expand to their variations.
              - paragraph [ref=f11e78]:
                - button "Check selection count" [ref=f11e79] [cursor=pointer]
              - status [ref=f11e80]: "At last check: 3 deduplicated price targets match the range on stored regular prices. 2 excluded by the range; 0 unreadable; 0 missing. Preview explains skipped or unsupported products."
              - paragraph [ref=f11e81]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f11e82]:
                - paragraph [ref=f11e83]:
                  - checkbox "Only change products in a price range" [checked] [ref=f11e84] [cursor=pointer]
                  - generic [ref=f11e85]: Only change products in a price range
                - paragraph [ref=f11e86]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
