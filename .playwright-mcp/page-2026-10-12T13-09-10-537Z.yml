          - paragraph [ref=f11e54]:
            - strong [ref=f11e55]: "Category selections use current membership: products added to or removed from the category since the previous job enter or leave the new Preview. The new Preview freezes its own product list for your review."
          - generic [ref=f11e56]:
            - group "1. Select products" [ref=f11e57]:
              - paragraph [ref=f11e59]: Choose specific products or one category. Categories include direct members only by default; subcategories are not included unless you enable Include subcategories. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
