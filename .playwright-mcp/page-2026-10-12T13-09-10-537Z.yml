          - paragraph [ref=f11e49]: "Original operation: Set sale prices to 20% below each product’s reviewed Regular Price; nearest Price Ending .99 (ties upward) · 3 products (1 variation)"
          - paragraph [ref=f11e50]: "This creates a new pricing operation. Current product prices and eligibility will be checked, current category membership may differ from the previous job, and a new Preview with a separate approval is required. This is not Undo, Resume or an automatic retry: no historical approval stays valid and no price changes until you approve the new Preview."
