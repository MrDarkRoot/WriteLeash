        - generic [ref=f4e43]:
          - heading "WriteLeash Bulk Prices" [level=1] [ref=f4e44]
          - paragraph [ref=f4e46]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
          - paragraph [ref=f4e47]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
          - paragraph [ref=f4e48]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
          - heading "New price change" [level=2] [ref=f4e49]
          - heading "Saved price presets" [level=2] [ref=f4e50]
          - paragraph [ref=f4e51]: Presets save configuration only. Load, edit, then prepare and approve a fresh Preview. Current products, permissions and limits are checked again. Up to 20 presets per store; creators and administrators can manage them.
          - paragraph [ref=f4e52]: Presets save the editable selection and price range, not individual Preview exclusions. To exclude products, create a fresh Preview and confirm exclusions before approving it.
          - generic [ref=f4e53]:
            - group "1. Select products" [ref=f4e54]:
              - paragraph [ref=f4e56]: Choose specific products or one category. Categories include direct members only by default; subcategories are not included unless you enable Include subcategories. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
              - paragraph [ref=f4e57]:
                - generic [ref=f4e58]: Selection method
                - combobox "Selection method" [ref=f4e59] [cursor=pointer]:
                  - option "Choose products by name or SKU"
                  - option "Product category" [selected]
                  - option "One exact SKU"
                  - 'option "Advanced: manual product IDs"'
              - status [ref=f4e60]: Choose matches to add them. Search matches are not automatically selected; eligibility is checked in preview.
