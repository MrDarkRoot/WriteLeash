              - paragraph [ref=f4e78]:
                - button "Check selection count" [ref=f4e79] [cursor=pointer]
              - status [ref=f4e80]: Selection changed. Check selection count again; Preview resolves and freezes the products independently.
              - paragraph [ref=f4e81]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f4e82]:
                - paragraph [ref=f4e83]:
                  - checkbox "Only change products in a price range" [ref=f4e84] [cursor=pointer]
                  - generic [ref=f4e85]: Only change products in a price range
                - paragraph [ref=f4e86]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
