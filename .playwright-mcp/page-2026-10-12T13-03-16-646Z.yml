            - group "2. Choose the price change" [ref=f6e93]:
              - paragraph [ref=f6e95]:
                - generic [ref=f6e96]: Price to change
                - combobox "Price to change" [ref=f6e97] [cursor=pointer]:
                  - option "Regular price" [selected]
                  - option "Sale price"
              - paragraph [ref=f6e98]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
              - paragraph [ref=f6e99]:
                - generic [ref=f6e100]: Operation
                - combobox "Operation" [ref=f6e101] [cursor=pointer]:
                  - option "Set an exact price"
                  - option "Increase by fixed amount"
                  - option "Decrease by fixed amount"
                  - option "Increase by percent"
                  - option "Decrease by percent" [selected]
                  - option "Clear Sale Price"
                  - option "Sale discount from Regular Price (%)"
              - paragraph [ref=f6e102]:
                - generic [ref=f6e103]: Price Ending (optional)
                - combobox "Price Ending (optional)" [ref=f6e104] [cursor=pointer]:
                  - option "Unchanged / Default" [selected]
                  - option "End in .99" [disabled]
                  - option "End in .95" [disabled]
                  - option "End in .90" [disabled]
                  - option "Whole-number price"
              - paragraph [ref=f6e105]: Nearest nonnegative matching price; exact ties go upward. Below the first ending, use 0.99, 0.95 or 0.90; whole prices may become zero. Default keeps existing calculations. .99/.95 need two decimal places; .90 needs one. Clear Sale ignores endings and stays blank. Preview checks the final rounded price against all safety limits.
              - paragraph [ref=f6e106]:
                - generic [ref=f6e107]: Percentage (e.g. 8 for 8%)
                - textbox "Percentage (e.g. 8 for 8%)" [ref=f6e125]
              - paragraph [ref=f6e109]: Enter a positive number or zero. Use a dot for decimals; leave out currency symbols and the % sign.
              - paragraph [ref=f6e110]: Choose Sale price for Clear or Sale discount. Clear makes Sale Price blank and preserves sale schedules; safety caps check the return to Regular Price. Sale discount requires an explicit 0–100 percentage (up to six decimal places), calculated from each product’s own reviewed Regular Price. A changed Regular Price conflicts at Apply; the approved target is never recalculated. Zero or a sale at Regular Price still must pass eligibility and safety checks.
