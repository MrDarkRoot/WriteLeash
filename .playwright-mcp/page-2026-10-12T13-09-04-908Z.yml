                  - generic [ref=f10e76]: Include subcategories
                - paragraph [ref=f10e77]: When enabled, products in all nested subcategories are included once. Variable parents expand to their variations.
              - paragraph [ref=f10e78]:
                - button "Check selection count" [ref=f10e79] [cursor=pointer]
              - status [ref=f10e80]: Check the number of price targets before Preview, including variations.
              - paragraph [ref=f10e81]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f10e82]:
                - paragraph [ref=f10e83]:
                  - checkbox "Only change products in a price range" [checked] [ref=f10e84] [cursor=pointer]
                  - generic [ref=f10e85]: Only change products in a price range
                - paragraph [ref=f10e86]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
                - paragraph [ref=f10e87]:
