          - paragraph [ref=f10e54]:
            - strong [ref=f10e55]: "Category selections use current membership: products added to or removed from the category since the previous job enter or leave the new Preview. The new Preview freezes its own product list for your review."
          - generic [ref=f10e56]:
            - group "1. Select products" [ref=f10e57]:
              - paragraph [ref=f10e59]: Choose specific products or one category. Categories include direct members only by default; subcategories are not included unless you enable Include subcategories. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
              - paragraph [ref=f10e60]:
                - generic [ref=f10e61]: Selection method
                - combobox "Selection method" [ref=f10e62] [cursor=pointer]:
                  - option "Choose products by name or SKU"
                  - option "Product category" [selected]
                  - option "One exact SKU"
                  - 'option "Advanced: manual product IDs"'
              - status [ref=f10e63]: All direct members of this category will be checked in Preview, including variations. Subcategories are not included.
              - generic [ref=f10e64]:
                - group [ref=f10e65]:
                  - generic "Search categories without live suggestions" [ref=f10e66] [cursor=pointer]
