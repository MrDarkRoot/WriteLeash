        - heading "WriteLeash Bulk Prices" [level=1] [ref=f16e36]
        - paragraph [ref=f16e37]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
        - paragraph [ref=f16e38]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
        - paragraph [ref=f16e39]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
        - heading "New price change" [level=2] [ref=f16e40]
        - generic [ref=f16e41]:
          - group "1. Select products" [ref=f16e42]:
            - paragraph [ref=f16e44]: Choose specific products or one category. Categories include direct members only; subcategories are not included. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
            - paragraph [ref=f16e45]:
              - generic [ref=f16e46]: Selection method
              - combobox "Selection method" [ref=f16e47] [cursor=pointer]:
                - option "Choose products by name or SKU"
                - option "Product category"
                - option "One exact SKU" [selected]
                - 'option "Advanced: manual product IDs"'
            - status
            - group [ref=f16e381]:
              - generic "Exact SKU or manual product IDs" [ref=f16e382] [cursor=pointer]
              - paragraph [ref=f16e383]: Enter one complete SKU or comma-separated product IDs for the selection method chosen above.
              - paragraph [ref=f16e384]:
                - generic [ref=f16e385]: One exact SKU
                - textbox "One exact SKU" [ref=f16e386]
          - group "2. Choose the price change" [ref=f16e66]:
            - paragraph [ref=f16e68]:
