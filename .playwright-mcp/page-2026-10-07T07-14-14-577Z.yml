                - option "Regular price" [selected]
                - option "Sale price"
            - paragraph [ref=f16e71]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
            - paragraph [ref=f16e72]:
              - generic [ref=f16e73]: Operation
              - combobox "Operation" [ref=f16e74] [cursor=pointer]:
