        - heading "WriteLeash Bulk Prices" [level=1] [ref=f1e251]
        - paragraph [ref=f1e252]: Preview bulk regular or sale prices before they happen. Run them safely. If the price or a checked setting changed after review, WriteLeash leaves the newer value alone. Undo changes that are still safe to restore.
        - paragraph [ref=f1e253]: Change the stored price of published simple products and variations of published variable products in the base store currency. Variations can be selected as a whole product or individually. Sale dates, stock, orders and subscriptions are not changed.
        - paragraph [ref=f1e254]: "Up to 1000 selected products per new job in the tested configuration. Planned prices are not guaranteed shopper prices: taxes, currency settings, dynamic pricing and later edits still apply. You can close this page at any time; saved progress appears again when you return."
        - heading "New price change" [level=2] [ref=f1e255]
        - generic [ref=f1e256]:
          - group "1. Select products" [ref=f1e257]:
            - paragraph [ref=f1e259]: Choose specific products or one category. Categories include direct members only; subcategories are not included. Search matches are not automatically selected and do not guarantee eligibility. Preview checks every selected product. Maximum 1000 selected products.
