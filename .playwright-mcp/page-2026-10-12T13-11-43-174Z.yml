                  - paragraph [ref=f7e60]: This product’s price or other conditions changed after you reviewed the preview. WriteLeash left the newer value unchanged. The product changed after review; the newer stored price was not overwritten.
                  - paragraph [ref=f7e61]: "At page load: 37.50. At page load, this product has a sale price or schedule; a matching regular price alone does not authorize overwriting it."
