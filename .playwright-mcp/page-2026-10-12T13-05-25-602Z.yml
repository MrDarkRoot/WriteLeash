                  - option "Regular price" [selected]
                  - option "Sale price"
              - paragraph [ref=f18e98]: Regular price is the everyday price. Sale price is the discounted price during a sale. WriteLeash changes only the price you choose and keeps the other one.
              - paragraph [ref=f18e99]:
                - generic [ref=f18e100]: Operation
                - combobox "Operation" [ref=f18e101] [cursor=pointer]:
                  - option "Set an exact price"
                  - option "Increase by fixed amount" [selected]
                  - option "Decrease by fixed amount"
                  - option "Increase by percent"
                  - option "Decrease by percent"
                  - option "Clear Sale Price"
                  - option "Sale discount from Regular Price (%)"
              - paragraph [ref=f18e102]:
                - generic [ref=f18e103]: Price Ending (optional)
                - combobox "Price Ending (optional)" [ref=f18e104] [cursor=pointer]:
                  - option "Unchanged / Default" [selected]
                  - option "End in .99"
                  - option "End in .95"
                  - option "End in .90"
                  - option "Whole-number price"
              - paragraph [ref=f18e105]: Nearest nonnegative matching price; exact ties go upward. Below the first ending, use 0.99, 0.95 or 0.90; whole prices may become zero. Default keeps existing calculations. .99/.95 need two decimal places; .90 needs one. Clear Sale ignores endings and stays blank. Preview checks the final rounded price against all safety limits.
              - paragraph [ref=f18e106]:
                - generic [ref=f18e107]: Amount to increase by
                - textbox "Amount to increase by" [ref=f18e108]: "5"
              - paragraph [ref=f18e109]: Enter a positive number or zero. Use a dot for decimals; leave out currency symbols and the % sign.
              - paragraph [ref=f18e110]: Choose Sale price for Clear or Sale discount. Clear makes Sale Price blank and preserves sale schedules; safety caps check the return to Regular Price. Sale discount requires an explicit 0–100 percentage (up to six decimal places), calculated from each product’s own reviewed Regular Price. A changed Regular Price conflicts at Apply; the approved target is never recalculated. Zero or a sale at Regular Price still must pass eligibility and safety checks.
