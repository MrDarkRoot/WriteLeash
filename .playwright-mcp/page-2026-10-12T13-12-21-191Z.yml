              - status [ref=f12e80]: Check the number of price targets before Preview, including variations.
              - paragraph [ref=f12e81]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f12e82]:
                - paragraph [ref=f12e83]:
                  - checkbox "Only change products in a price range" [ref=f12e84] [cursor=pointer]
                  - generic [ref=f12e85]: Only change products in a price range
                - paragraph [ref=f12e86]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
