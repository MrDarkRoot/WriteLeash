              - status [ref=f20e116]: Check the number of price targets before Preview, including variations.
              - paragraph [ref=f20e117]: Counts are informational and can change. Preview resolves the selection again and freezes the exact products for your review; no count authorizes a price change.
              - generic [ref=f20e118]:
                - paragraph [ref=f20e119]:
                  - checkbox "Only change products in a price range" [ref=f20e120] [cursor=pointer]
                  - generic [ref=f20e121]: Only change products in a price range
                - paragraph [ref=f20e122]: "Optional. When enabled, Preview includes only products whose stored price falls within the inclusive range: the minimum and maximum both count as matches. Each variation is judged by its own price, not its parent’s. Products without a stored sale price never match a sale-price range. Use unsigned numbers with a dot for decimals; leave out currency symbols."
