services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: commitcap
      POSTGRES_USER: commitcap_admin
      POSTGRES_PASSWORD: commitcap_admin_experiment_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitcap_admin -d commitcap"]
      interval: 1s
      timeout: 5s
      retries: 30
