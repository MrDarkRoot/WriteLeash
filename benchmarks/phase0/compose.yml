services:
  postgres:
    build:
      context: ../..
      dockerfile: benchmarks/phase0/Dockerfile
    command: ["postgres", "-c", "shared_preload_libraries=commitcap_native_tx_state"]
    environment:
      POSTGRES_DB: commitcap_native
      POSTGRES_USER: commitcap_native_admin
      POSTGRES_PASSWORD: commitcap_native_admin_experiment_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U commitcap_native_admin -d commitcap_native"]
      interval: 1s
      timeout: 5s
      retries: 30
