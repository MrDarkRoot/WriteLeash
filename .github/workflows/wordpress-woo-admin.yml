name: WordPress Woo Free Admin workflow
on:
  workflow_call:
permissions:
  contents: read
jobs:
  woo-free-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Actual Woo 11.1.2 Free Admin journey on MySQL and MariaDB
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/wl167-browser-tools" playwright@1.61.0
          export NODE_PATH="$RUNNER_TEMP/wl167-browser-tools/node_modules"
          export WL167_EVIDENCE="$RUNNER_TEMP/woo-selection-167"
          bash wordpress/tests/admin/run.sh 2>&1 | tee "$RUNNER_TEMP/woo-admin-111.txt"
      - name: Preserve lab activity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woo-admin-111
          path: |
            ${{ runner.temp }}/woo-admin-111.txt
            ${{ runner.temp }}/woo-selection-167/**/*.png
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
