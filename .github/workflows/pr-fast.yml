name: PR checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: PR_FAST
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      feasibility: ${{ steps.owners.outputs.feasibility }}
      native: ${{ steps.owners.outputs.native }}
      engine: ${{ steps.owners.outputs.engine }}
      foundation: ${{ steps.owners.outputs.foundation }}
      research: ${{ steps.owners.outputs.research }}
      adapter: ${{ steps.owners.outputs.adapter }}
      historical: ${{ steps.owners.outputs.historical }}
      plan: ${{ steps.owners.outputs.plan }}
      journal: ${{ steps.owners.outputs.journal }}
      jobs: ${{ steps.owners.outputs.jobs }}
      undo: ${{ steps.owners.outputs.undo }}
      admin: ${{ steps.owners.outputs.admin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Public package and CI ownership gate
        run: bash .github/ci/pr-fast.sh
      - name: Immutable workflow syntax validator
        run: bash .github/ci/workflow-lint.sh
      - id: owners
        name: Classify exact base-to-head paths (including deletions)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/ci/ownership.py --base "$BASE_SHA" --head "$HEAD_SHA"
  feasibility:
    needs: fast
    if: needs.fast.outputs.feasibility == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/mysql-mariadb-feasibility.yml
  native:
    needs: fast
    if: needs.fast.outputs.native == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/native-pg16-security.yml
  engine:
    needs: fast
    if: needs.fast.outputs.engine == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-engine.yml
  foundation:
    needs: fast
    if: needs.fast.outputs.foundation == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-foundation.yml
  research:
    needs: fast
    if: needs.fast.outputs.research == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-plugin-research.yml
  adapter:
    needs: fast
    if: needs.fast.outputs.adapter == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-redirection-adapter.yml
  historical:
    needs: fast
    if: needs.fast.outputs.historical == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-release-matrix.yml
  plan:
    needs: fast
    if: needs.fast.outputs.plan == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-woo-plan.yml
  journal:
    needs: fast
    if: needs.fast.outputs.journal == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-woo-journal.yml
  jobs:
    needs: fast
    if: needs.fast.outputs.jobs == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-woo-jobs.yml
  undo:
    needs: fast
    if: needs.fast.outputs.undo == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-woo-undo.yml
  admin:
    needs: fast
    if: needs.fast.outputs.admin == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/wordpress-woo-admin.yml
  coverage:
    name: CI_COVERAGE
    needs: [fast, feasibility, native, engine, foundation, research, adapter, historical, plan, journal, jobs, undo, admin]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Propagate all path-owned results (no runtime work for docs)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/ci/check-coverage.py
