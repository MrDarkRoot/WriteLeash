name: WordPress Woo immutable plan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  woo-plan-107:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned Woo read-only planning, pure arithmetic and two-engine fixture
        shell: bash
        run: |
          set -euo pipefail
          bash wordpress/tests/free/run.sh 2>&1 | tee "$RUNNER_TEMP/woo-plan-107.txt"
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woo-plan-107
          path: ${{ runner.temp }}/woo-plan-107.txt
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
