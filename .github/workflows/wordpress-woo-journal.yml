name: WordPress Woo durable price journal
on:
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-woo-journal.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-woo-journal.yml'
permissions:
  contents: read
jobs:
  woo-durable-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Actual Woo 11.1.2 crash/concurrency/cache matrix on MySQL and MariaDB
        shell: bash
        run: |
          set -euo pipefail
          bash wordpress/tests/durable/run.sh 2>&1 | tee "$RUNNER_TEMP/woo-journal-108.txt"
      - name: Preserve lab activity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woo-journal-108
          path: ${{ runner.temp }}/woo-journal-108.txt
          retention-days: 7
