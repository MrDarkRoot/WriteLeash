name: Native PG16 security research suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-pg16-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned

      - name: Verify Docker and pin the local PostgreSQL 16.4 base image
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker Engine: {{.ServerVersion}}'
          docker compose version
          docker pull postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
          docker tag postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c postgres:16.4-alpine
          test "$(docker image inspect postgres:16.4-alpine --format '{{.Id}}')" = "$(docker image inspect postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c --format '{{.Id}}')"

      - name: Full integrated suite (no skips)
        shell: bash
        run: |
          set -euo pipefail
          ./experiments/native_tx_state/run.sh 2>&1 | tee "$RUNNER_TEMP/writeleash-native-suite.txt"
          bash .github/ci/assert-security-log.sh "$RUNNER_TEMP/writeleash-native-suite.txt"

      - name: One-command demo path (./demo.sh)
        shell: bash
        run: |
          set -euo pipefail
          ./demo.sh 2>&1 | tee "$RUNNER_TEMP/writeleash-demo.txt"
          grep -Fq 'Demo: PASS' "$RUNNER_TEMP/writeleash-demo.txt"
          grep -Fq 'Demo exit status: 0' "$RUNNER_TEMP/writeleash-demo.txt"

      - name: CLI/DX input and PostgreSQL catalog preflight tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./writeleash ./demo/product_plan.sh ./demo/product_update_demo.sh ./tests/writeleash_cli.sh ./tests/writeleash_catalog.sh ./tests/product_demo_plan.sh ./tests/writeleash_identity_scan.sh
          ./tests/writeleash_identity_scan.sh
          ./tests/writeleash_cli.sh
          ./tests/product_demo_plan.sh
          ./tests/writeleash_catalog.sh

      - name: Arbitrary-table product acceptance (two clean runs)
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2; do
            ./writeleash demo 2>&1 | tee "$RUNNER_TEMP/product-demo-run-${run}.txt"
            for marker in \
              'Product demo catalog preflight: PASS' \
              'Product demo safe transaction: PASS' \
              'Product demo denied transaction: PASS' \
              'Product demo sticky COMMIT rejection: PASS' \
              'Product demo independent second policy: PASS' \
              'Product demo fresh-admin durability: PASS' \
              'Product demo cleanup: PASS' \
              'Product Demo: PASS' \
              'Product Demo exit status: 0'; do
              grep -Fxq "$marker" "$RUNNER_TEMP/product-demo-run-${run}.txt"
            done
            test -z "$(docker compose -p writeleash_product_demo -f experiments/native_tx_state/docker-compose.yml ps -a -q)"
            test -z "$(docker network ls -q --filter label=com.docker.compose.project=writeleash_product_demo)"
            test -z "$(docker volume ls -q --filter label=com.docker.compose.project=writeleash_product_demo)"
          done

      - name: Remove disposable PostgreSQL resources
        if: always()
        shell: bash
        run: docker compose -f experiments/native_tx_state/docker-compose.yml down -v --remove-orphans

      - name: Preserve synthetic-only suite transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: native-pg16-security-log
          path: |
            ${{ runner.temp }}/writeleash-native-suite.txt
            ${{ runner.temp }}/writeleash-demo.txt
            ${{ runner.temp }}/product-demo-run-1.txt
            ${{ runner.temp }}/product-demo-run-2.txt
          if-no-files-found: ignore
          retention-days: 7
