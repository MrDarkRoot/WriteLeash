name: WordPress Woo conflict-aware Undo
on:
  workflow_call:
permissions:
  contents: read
jobs:
  woo-conflict-aware-undo:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Actual Woo 11.1.2 conflict-aware Undo crash/race/retention matrix on MySQL and MariaDB
        shell: bash
        run: |
          set -euo pipefail
          bash wordpress/tests/undo/run.sh 2>&1 | tee "$RUNNER_TEMP/woo-undo-110.txt"
      - name: Preserve lab activity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woo-undo-110
          path: ${{ runner.temp }}/woo-undo-110.txt
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
