name: MySQL and MariaDB feasibility research

on:
  pull_request:
    paths:
      - 'experiments/mysql_tx_budget/**'
      - 'wordpress/**'
      - '.github/workflows/mysql-mariadb-feasibility.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/mysql_tx_budget/**'
      - 'wordpress/**'
      - '.github/workflows/mysql-mariadb-feasibility.yml'

permissions:
  contents: read

jobs:
  mysql-mariadb-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Run both disposable transaction-budget assertions
        run: bash experiments/mysql_tx_budget/run.sh
