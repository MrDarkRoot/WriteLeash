services:
  mysql:
    image: mysql@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714 # 8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: disposable_root_password
      MYSQL_DATABASE: wp_test
      MYSQL_USER: wp_test
      MYSQL_PASSWORD: disposable_wp_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
  mariadb:
    image: mariadb@sha256:85c39719200637250bb8abe3ccd239239d6f175156fc1698141409fcf8e01a38 # 10.11.15
    environment:
      MARIADB_ROOT_PASSWORD: disposable_root_password
      MARIADB_DATABASE: wp_test
      MARIADB_USER: wp_test
      MARIADB_PASSWORD: disposable_wp_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
  tester:
    build:
      context: ../..
      dockerfile: tests/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - ../research/.cache:/opt/plugin-zips:ro
    command: ["sh", "/opt/tests/adapter/in-container.sh"]
